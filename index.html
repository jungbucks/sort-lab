<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한눈에 보는 정렬 실험실</title>
<meta name="description" content="숫자 카드 4~10장으로 정렬과 탐색의 과정을 한 단계씩 확인하는 수업용 시각화 도구">
<style>
/* ==========================================================
   한눈에 보는 정렬 실험실. 수업(빔프로젝터) 최적화 시각화 도구
   단일 파일 · 오프라인 · 외부 요청 0
   상태색: 비교=노랑 · 확정=초록 · 주인공(최솟값/든 카드)=보라
   ========================================================== */
:root {
  --bg: #FAFBFC;
  --card: #FFFFFF;
  --ink: #1E293B;
  --muted: #64748B;
  --line: #C8D1DD;
  --accent: #2563EB;        /* UI 조작부 */
  --accent-dark: #1E40AF;
  --cmp: #FACC15;           /* 비교 중 */
  --done: #16A34A;          /* 자리 확정 */
  --done-soft: #E7F6EC;
  --hero: #7C3AED;          /* 왕관 후보 / 든 카드 */
  --radius: 10px;
  --shadow: none;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Pretendard Variable', Pretendard, 'Malgun Gothic', -apple-system, sans-serif;
  background: var(--bg); color: var(--ink);
  line-height: 1.65; min-height: 100vh;
}
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- 헤더 ---------- */
header { max-width:980px;margin:0 auto;padding:32px 20px 8px;text-align:left; }
h1 { font-size:clamp(28px,4.5vw,36px);font-weight:750;letter-spacing:-.025em; }
h1 .a { color: var(--accent); }
.sub { color: var(--muted); margin-top: 8px; font-size: 16px; }

/* ---------- 알고리즘 탭 ---------- */
.algo-tabs { display:flex;gap:4px;max-width:980px;justify-content:flex-start;margin:16px auto 0;flex-wrap:wrap;padding:0 20px; }
.algo-tab { font-family:inherit;font-size:16px;font-weight:650;cursor:pointer;background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;border-radius:0;padding:12px 18px;transition:color .15s,border-color .15s; }
.algo-tab:hover { color:var(--ink);background:#F0F3F7; }
.algo-tab.on { border-color:var(--accent);color:var(--accent-dark);background:transparent; }

/* ---------- 무대 ---------- */
main { max-width: 980px; margin: 0 auto; padding: 18px 20px 70px; }
.stage-wrap {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 26px 26px 18px; margin-top: 16px;
}
/* 세로 배치 변수: --top=카드 위 여백(들림 애니메이션용), --ch=카드 높이, --ttop=합병 임시 줄 위치 */
.stage { --top: 84px; --ch: 150px; --ttop: calc(var(--top) + var(--ch) + 45px);
  position: relative; height: calc(var(--top) + var(--ch) + 45px); }
.stage.merge { --ch: 120px; height: calc(var(--ttop) + var(--ch) + 30px); }
.baseline { position: absolute; left: 0; right: 0; top: calc(var(--top) + var(--ch)); height: 3px; background: var(--line); border-radius: 2px; }
.slot-label { position: absolute; top: calc(var(--top) + var(--ch) + 10px); font-size: 14px; font-weight: 800; color: var(--muted); width: var(--sw); text-align: center; white-space: nowrap; }
.stage.tight .slot-label { font-size: 12px; letter-spacing: -.02em; }

/* 카드 = 균일한 숫자 카드(트럼프 무드). 값은 크기(그래프)가 아니라 숫자로 읽는다.
   시각의 주인공은 카드의 "위치 이동 애니메이션"(FLIP + 스칠 때 호핑). 2026-07-16 개편 */
.ncard {
  position: absolute; top: var(--top); width: var(--cw); height: var(--ch);
  display: flex; align-items: center; justify-content: center;
  background: #FFFFFF;
  border: 2.5px solid var(--line); border-radius: clamp(8px, calc(var(--cw) * .2), 16px);
  box-shadow: 0 3px 6px rgba(30,41,59,.07);
  /* 글자 크기 = 카드 폭에 비례(--cw는 JS layout()이 컨테이너 폭/카드 수로 계산). 두 자리가 카드 안에 들어가게 */
  font-weight: 900; font-size: clamp(15px, calc((var(--cw) - 8px) * .68), 46px); font-variant-numeric: tabular-nums;
  letter-spacing: -.02em; white-space: nowrap;
  color: var(--ink);
  transition: left .28s cubic-bezier(.25, 1, .4, 1), top .28s cubic-bezier(.25, 1, .4, 1), transform .22s ease,
              background .2s, border-color .2s, color .2s, box-shadow .2s, opacity .2s;
}
/* 트럼프식 코너 숫자. CSS content라 textContent(프로브)엔 안 잡힘 */
.ncard::before, .ncard::after {
  content: attr(data-v); position: absolute; font-size: 14px; font-weight: 800; opacity: .38;
}
.ncard::before { top: 6px; left: 10px; }
.ncard::after { bottom: 6px; right: 10px; transform: rotate(180deg); }
.stage.tight .ncard::before, .stage.tight .ncard::after { display: none; }   /* 좁은 카드: 코너 숫자 숨김 */
.stage.tight .ncard.done .chk::after { right: 50%; transform: translateX(50%); top: 2px; font-size: 12px; }
.ncard .crown { position: absolute; top: -38px; left: 50%; transform: translateX(-50%); font-size: 26px; display: none; }
.ncard.key .crown { display: block; }
.ncard.key { border-color: var(--hero); background: #F2EDFC; color: #6D28D9; }
/* 합병 정렬: 중간에 합쳐진 "정리된 무더기"(확정 전) = 옅은 파랑 */
.ncard.merged { border-color: #38BDF8; background: #E0F2FE; color: #0369A1; }
.ncard.intemp { top: var(--ttop); }
.ncard.cmp {
  transform: translateY(-14px);
  border-color: var(--cmp); background: #FFF5CC; color: #92400E;
  box-shadow: 0 4px 8px rgba(30,41,59,.10);
}
.ncard.held {
  transform: translateY(-72px) scale(1.07) rotate(-3deg); z-index: 5;
  border-color: var(--hero); background: #F2EDFC; color: #6D28D9;
  box-shadow: 0 6px 12px rgba(30,41,59,.12);
}
.ncard.done { border-color: var(--done); background: #E7F6EC; color: #15803D; }
.ncard.done .chk::after { content: '✓'; position: absolute; top: 5px; right: 9px; font-size: 15px; font-weight: 900; color: var(--done); }
.ncard.dim { opacity: .25; }                       /* 탐색 배제 / 퀵 비활성 구간 */
/* 교환 순간: 한 카드는 위로 넘고, 한 카드는 아래로 스친다. "촵" */
.ncard.hop  { transform: translateY(-28px) rotate(2deg); z-index: 4; }
.ncard.hop2 { transform: translateY(12px) scale(.96); z-index: 1; }
/* 합병 정렬: 가운데 세로 구분선 · 임시 줄 칸 */
.divider { position: absolute; top: calc(var(--top) - 12px); height: calc(var(--ch) + 24px); width: 0;
  border-left: 3px dashed var(--ink); margin-left: -1.5px; display: none; z-index: 3; }
.divider.show { display: block; }
.tslot { position: absolute; top: var(--ttop); width: var(--cw); height: var(--ch);
  border: 2px dashed var(--line); border-radius: clamp(8px, calc(var(--cw) * .2), 16px); opacity: .55; }
.tslot.on { border-color: #64748B; opacity: 1; }
.tcap { position: absolute; left: 0; right: 0; top: calc(var(--ttop) + var(--ch) + 6px); text-align: center;
  font-size: 13px; font-weight: 700; color: var(--muted); }
/* 카드 위 한 줄(모든 탭 같은 높이 → 탭을 바꿔도 카드 줄이 위아래로 움직이지 않음)
   정렬 탭 = 탭 제목 · 선택 정렬 = 최소 후보 변수 · 탐색 탭 = 찾을 번호 */
.topbar { height: 52px; margin-bottom: 6px; }
.tb { display: none; height: 100%; align-items: center; flex-wrap: wrap; align-content: center; column-gap: 10px; row-gap: 2px;
  padding: 0 14px; border: 1px solid transparent; border-radius: 8px; line-height: 1.35; overflow: hidden; }
body:not(.search):not(.select) .tb-title { display: flex; }
.tb-title { padding-left: 2px; font-size: 16px; font-weight: 700; color: var(--ink); }
.tb-title span { color: var(--muted); font-weight: 600; }
.target { font-size: 19px; font-weight: 900; background: #FFFBE8; border-color: var(--cmp); }
.target b { color: #A16207; font-size: 23px; }
.target .btn { font-size: 14px; padding: 5px 12px; margin-left: 4px; }
body.search .target { display: flex; }
body.search #swpWrap { display: none; }            /* 탐색 모드엔 이동 카운터 무의미 */
body.search .ncard { cursor: pointer; }             /* 탐색: 카드를 누르면 그 숫자가 목표 */

/* 선택정렬 전용. 최소 후보를 담는 변수(왕관 = 이 변수의 시각화) */
.minvar { font-size: 16px; font-weight: 800; background: #F2EDFC; border-color: var(--hero); color: #6D28D9; }
.minvar b { font-size: 21px; font-variant-numeric: tabular-nums; }
.minvar .slotn { color: #7C6BAF; font-weight: 700; font-size: 13px; margin-left: 4px; }
body.select .minvar { display: flex; }

/* 색 범례: 지금 탭에 나오는 표시만 */
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 14px; height: 18px; border-radius: 4px; border: 2px solid var(--line); background: #fff;
  font-style: normal; font-size: 11px; font-weight: 900; line-height: 14px; text-align: center; }
.legend i.cmp { border-color: var(--cmp); background: #FFF5CC; }
.legend i.done { border-color: var(--done); background: #E7F6EC; color: var(--done); }
.legend i.dim { opacity: .3; }
.legend i.hero { border-color: var(--hero); background: #F2EDFC; }
.legend i.merged { border-color: #38BDF8; background: #E0F2FE; }
.legend i.emo { border: 0; background: none; width: auto; height: auto; font-size: 15px; line-height: 1; }

/* ---------- 내레이션 ---------- */
.narr { margin-top:16px;min-height:66px;background:#F4F6F9;border:1px solid var(--line);border-radius:8px;padding:15px 20px;font-size:clamp(16px,2.4vw,21px);font-weight:600;line-height:1.65;display:flex;align-items:center;flex-wrap:wrap; }
.narr b {
  display: inline-block; margin: 0 3px; padding: 1px 9px;
  background: #E6EDFB; color: var(--accent-dark);
  border-radius: 8px; font-weight: 900; font-variant-numeric: tabular-nums;
  white-space: nowrap;                              /* 칩은 세로로 깨지지 말고 통째로 줄바꿈 */
}
.narr .y b { background: #FEF3C7; color: #92400E; }
.narr .g b { background: #DCFCE7; color: #15803D; }
.narr .v b { background: #EDE4FE; color: #6D28D9; }
.narr .y, .narr .g, .narr .v { margin: 0 5px; }
.narr .narr-note { display: block; width: 100%; font-size: .78em; font-weight: 700; color: var(--accent-dark); }
.narr .y { color: #B45309; } .narr .m { color: #0369A1; } .narr .g { color: #15803D; } .narr .v { color: #6D28D9; }

/* ---------- 컨트롤 ---------- */
.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 16px; align-items: center; }
.btn { font-family:inherit;font-size:15.5px;font-weight:650;cursor:pointer;border:1px solid transparent;border-radius:7px;padding:11px 20px;background:var(--accent);color:#fff;transition:transform .14s,background .15s; }
.btn:hover:not(:disabled) { filter:brightness(1.05); }
.btn:active:not(:disabled) { transform: translateY(0) scale(.97); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.big { font-size: 17px; padding: 13px 30px; }
.btn.ghost { background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none; }
.btn.ghost:hover:not(:disabled) { border-color: var(--accent); }
.btn.ghost.on { border-color: var(--accent); color: var(--accent-dark); background: #EFF4FE; }
@media (hover: none) and (pointer: coarse) { #btnNext kbd { display: none; } }   /* 터치 기기엔 키 배지 숨김 */
kbd { font-family: inherit; font-size: 12px; background: rgba(255,255,255,.25); border-radius: 5px; padding: 1px 7px; margin-left: 6px; }
.btn.ghost kbd { background: var(--bg); color: var(--muted); }

/* ---------- 카운터 & 입력 ---------- */
.meta-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; align-items: center; margin-top: 14px; }
.counter { font-size:15px;font-weight:500;color:var(--muted);padding:6px 4px; }
.counter b { color: var(--ink); font-variant-numeric: tabular-nums; }
.numin { display: flex; gap: 8px; align-items: center; }
.numin input {
  font-family: inherit; font-size: 15px; width: 190px;
  border: 2px solid var(--line); border-radius: 10px; padding: 9px 12px;
  background: var(--card); color: var(--ink);
}
.numin input:focus { border-color: var(--accent); outline: none; }
.numin input.bad { border-color: #DC2626; }
.inerr { margin-top: 8px; text-align: center; font-size: 15px; font-weight: 700; color: #B91C1C; }
.inerr:empty { display: none; }

/* 이 숫자로 해 본 결과 (메모리만, 숫자 세트가 바뀌면 비움) */
.results { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
.results h3 { font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.rtables { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 28px; }
.rtables table { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.rtables th, .rtables td { padding: 3px 10px; text-align: right; border-bottom: 1px solid #E5E9F0; }
.rtables th:first-child, .rtables td:first-child { text-align: left; padding-left: 0; }
.rtables th { font-weight: 700; color: var(--muted); font-size: 13px; }
.rtables td.none { color: #A0AEC0; }
.rtables tr.cur td { font-weight: 800; color: var(--accent-dark); }
.countctl { display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;color:var(--muted);padding:6px 4px; }
.countctl b { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 1ch; text-align: center; }
.countctl input[type=range] { -webkit-appearance: none; appearance: none; width: 124px; height: 7px; border-radius: 99px; background: var(--line); cursor: pointer; }
.countctl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.28); }
.countctl input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border: 3px solid #fff; border-radius: 50%; background: var(--accent); box-shadow: 0 1px 5px rgba(0,0,0,.28); }

/* ---------- 설명 카드 ---------- */
.explain {
  max-width: 980px; margin: 26px auto 0;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 22px 26px;
}
.explain h2 { font-size:20px;font-weight:700;margin-bottom:8px; }
.explain p { font-size:16px;color:var(--muted);line-height:1.8; }
.explain p.aka { font-size:14px;font-weight:600;margin:-4px 0 8px; }
.explain b { color: var(--ink); }
.explain .think { margin-top:16px;background:#F7F8FA;border:1px solid var(--line);border-radius:7px;padding:14px 16px;font-size:16px;color:var(--ink);line-height:1.8; }

footer { text-align: center; color: var(--muted); font-size: 13.5px; padding: 22px; }

@media (max-width: 640px) {
  .stage { --top: 60px; --ch: 118px; }
  .stage.merge { --ch: 92px; }
  .ncard.held { transform: translateY(-50px) scale(1.04) rotate(-3deg); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
/* Keep the worksheet readable on small screens without shrinking card values. */
body{word-break:keep-all;overflow-wrap:break-word;}
.narr b{padding:0 4px;border-radius:4px;}

@media(max-width:640px){
 header{padding:24px 16px 8px;}main{padding-left:16px;padding-right:16px;}.algo-tabs{gap:0;padding:0 16px;}.algo-tab{padding:10px 12px;font-size:15px;}
 .stage-wrap{padding:20px 12px 16px;}.explain{padding:20px 16px;}
 .controls{gap:8px;}.btn{padding:10px 14px;}.btn.big{padding:11px 18px;}
 .numin{max-width:100%;}.numin input{min-width:0;max-width:100%;width:180px;}
 .narr{padding:12px;}.meta-row{gap:12px;}
 .topbar{height:58px;}.tb{padding:0 10px;}.target{font-size:17px;}.target b{font-size:20px;}.minvar{font-size:15px;}
 .ncard::before,.ncard::after{display:none;}
}
</style>
</head>
<body>

<header>
  <h1>정렬 실험실</h1>
  <p class="sub">다음에 움직일 카드를 예상하고, 한 단계씩 확인해 보세요.</p>
</header>

<div class="algo-tabs" id="algoTabs">
  <button class="algo-tab on" data-algo="bubble">버블 정렬</button>
  <button class="algo-tab" data-algo="select">선택 정렬</button>
  <button class="algo-tab" data-algo="insert">삽입 정렬</button>
  <button class="algo-tab" data-algo="quick">퀵 정렬</button>
  <button class="algo-tab" data-algo="merge">합병 정렬</button>
  <button class="algo-tab" data-algo="seq">순차 탐색</button>
  <button class="algo-tab" data-algo="bin">이진 탐색</button>
</div>

<main>
  <div class="stage-wrap">
    <div class="topbar">
      <div class="tb tb-title" id="tabTitle"></div>
      <div class="tb target" id="targetBanner">찾을 번호: <b id="targetVal">?</b>
        <button class="btn ghost" id="btnMissing">없는 숫자 찾기</button></div>
      <div class="tb minvar" id="minVar" aria-live="polite"></div>
    </div>
    <div class="stage" id="stage"><div class="baseline"></div></div>
    <div class="legend" id="legend" aria-label="색 범례"></div>
    <div class="narr" id="narr"></div>
    <div class="controls">
      <button class="btn ghost" id="btnReset">처음부터</button>
      <button class="btn ghost" id="btnPrev" aria-keyshortcuts="ArrowLeft" title="이전 단계 (← 키)">이전 단계</button>
      <button class="btn big" id="btnNext" aria-keyshortcuts="Space ArrowRight">다음 단계 <kbd>Space</kbd></button>
      <button class="btn ghost" id="btnAuto">자동 재생</button>
      <button class="btn ghost" id="btnFast" aria-label="재생 속도 ×1">×1</button>
    </div>
    <div class="meta-row">
      <span class="counter">비교 <b id="cntCmp">0</b>회</span>
      <span class="counter" id="swpWrap">↔ 이동 <b id="cntSwp">0</b>회</span>
      <label class="countctl" for="cardCount">카드 수 <b id="cardCountLbl">8</b>
        <input type="range" id="cardCount" min="4" max="10" step="1" value="8" aria-label="카드 개수 4에서 10까지 선택">
      </label>
      <button class="btn ghost" id="btnShuffle">새 숫자</button>
      <span class="numin">
        <input id="numInput" placeholder="직접 입력: 34,7,88,21,55,72,44,13" aria-label="숫자 8개 직접 입력" aria-describedby="inputErr">
        <button class="btn ghost" id="btnApply">적용</button>
      </span>
    </div>
    <p class="inerr" id="inputErr" role="status" aria-live="polite"></p>
    <section class="results" aria-labelledby="resTitle">
      <h3 id="resTitle">이 숫자로 해 본 결과</h3>
      <div class="rtables">
        <table id="resSort"><thead><tr><th scope="col">정렬</th><th scope="col">비교</th><th scope="col">이동</th></tr></thead><tbody></tbody></table>
        <table id="resSearch"><thead><tr><th scope="col">탐색</th><th scope="col">찾을 번호</th><th scope="col">비교</th></tr></thead><tbody></tbody></table>
      </div>
    </section>
  </div>

/* 숫자 뒤 조사: 한국어로 읽었을 때의 받침 기준.
   끝자리 1 일·3 삼·6 육·7 칠·8 팔 = 받침 있음 / 2·4·5·9 = 없음 / 끝자리 0 = 십·백(영)으로 읽혀 받침 있음.
   로/으로: ㄹ 받침(1·7·8)이나 받침 없음 → "로" */
function jo(n, t) {
  const d = Math.abs(n) % 10;
  const has = d === 0 || d === 1 || d === 3 || d === 6 || d === 7 || d === 8;
  const rieul = d === 1 || d === 7 || d === 8;
  switch (t) {
    case '와': case '과': return has ? '과' : '와';
    case '이': case '가': return has ? '이' : '가';
    case '을': case '를': return has ? '을' : '를';
    case '은': case '는': return has ? '은' : '는';
    case '로': case '으로': return has && !rieul ? '으로' : '로';
  }
  return '';
}

/* ================================================================
   단계 생성. 배열 시뮬레이션하며 카드 id 기준으로 기록
   step: { t, ...payload, msg }
   t: compare(a,b슬롯) | swap(a,b) | fix(슬롯) | key(슬롯)/keyclear
      | pick(슬롯) | shift(from,to) | place(슬롯) | done
================================================================ */
function genSteps(vals, kind, target) {
  const a = vals.map((v, i) => ({ v, id: i }));   // 시뮬레이션 모델
  const S = [];
  const vv = i => a[i].v;

  if (kind === 'bubble') {
    for (let pass = 0; pass < N - 1; pass++) {
      for (let j = 0; j < N - 1 - pass; j++) {
        const big = vv(j) > vv(j + 1);
        S.push({ t: 'compare', i: j, j: j + 1,
          msg: `<b>${vv(j)}</b>${jo(vv(j), '와')} <b>${vv(j + 1)}</b> 비교. ` + (big
            ? `<span class="y">${vv(j)}${jo(vv(j), '이')} 큽니다. 뒤로 옮깁니다.</span>` : `<span class="g">작은 수가 앞에 있으므로 그대로 둡니다.</span>`) });
        if (big) {
          S.push({ t: 'swap', i: j, j: j + 1, msg: `<b>${vv(j)}</b> ↔ <b>${vv(j + 1)}</b> 자리 교환` });
          [a[j], a[j + 1]] = [a[j + 1], a[j]];
        }
      }
      S.push({ t: 'fix', i: N - 1 - pass, msg: `✅ <span class="g"><b>${vv(N - 1 - pass)}</b> 자리 확정!</span> 가장 큰 수가 거품처럼 떠올랐다` });
    }
    S.push({ t: 'fix', i: 0, msg: '' });
  }

  if (kind === 'select') {
    for (let i = 0; i < N - 1; i++) {
      let k = i;
      S.push({ t: 'key', i: k, v: vv(k), msg: `${i + 1}번째 자리에 놓을 수를 찾습니다. 최소 후보는 <span class="v"><b>${vv(k)}</b></span>입니다.` });
      for (let j = i + 1; j < N; j++) {
        const smaller = vv(j) < vv(k);
        S.push({ t: 'compare', i: j, j: k, keep: k,
          msg: `<b>${vv(j)}</b>${jo(vv(j), '와')} 후보 <span class="v"><b>${vv(k)}</b></span> 비교. ` + (smaller
            ? `<span class="v">더 작으므로 최소 후보를 바꿉니다.</span>` : `현재 최소 후보를 유지합니다.`) });
        if (smaller) { k = j; S.push({ t: 'key', i: k, v: vv(k), msg: `👑 새 후보: <span class="v"><b>${vv(k)}</b></span>` }); }
      }
      if (k !== i) {
        S.push({ t: 'swap', i, j: k, msg: `최소 후보 <b>${vv(k)}</b>${jo(vv(k), '이')} ${i + 1}번째 자리로. <b>${vv(i)}</b>${jo(vv(i), '와')} 교환` });
        [a[i], a[k]] = [a[k], a[i]];
      } else {
        S.push({ t: 'noop', msg: `최소 후보가 이미 제자리에 있어 교환하지 않습니다.` });
      }
      S.push({ t: 'fix', i, keyclear: true, msg: `✅ <span class="g"><b>${vv(i)}</b> 자리 확정!</span>` });
    }
    S.push({ t: 'fix', i: N - 1, msg: '' });
  }

  if (kind === 'insert') {
    for (let i = 1; i < N; i++) {
      const held = a[i];
      S.push({ t: 'pick', i, msg: `<span class="v"><b>${held.v}</b></span>${jo(held.v, '을')} 뽑아 들었다. 왼쪽 정리된 구간에서 자리를 찾자` });
      let j = i;
      while (j > 0 && a[j - 1].v > held.v) {
        S.push({ t: 'compare', i: j - 1, j: null, heldCmp: true,
          msg: `왼쪽 <b>${a[j - 1].v}</b>${jo(a[j - 1].v, '와')} 비교. <span class="y">${a[j - 1].v}${jo(a[j - 1].v, '이')} 크니까 오른쪽으로 밀기</span>` });
        S.push({ t: 'shift', from: j - 1, to: j, msg: `<b>${a[j - 1].v}</b>${jo(a[j - 1].v, '을')} 한 칸 오른쪽으로` });
        a[j] = a[j - 1]; j--;
      }
      if (j > 0) {
        S.push({ t: 'compare', i: j - 1, j: null, heldCmp: true,
          msg: `왼쪽 <b>${a[j - 1].v}</b>${jo(a[j - 1].v, '와')} 비교. <span class="g">${a[j - 1].v}${jo(a[j - 1].v, '이')} 더 작다. 여기가 자리!</span>` });
      }
      S.push({ t: 'place', i: j, id: held.id, msg: `<span class="v"><b>${held.v}</b></span> 내려놓기. ${j + 1}번째 자리!` });
      a[j] = held;
    }
    for (let i = 0; i < N; i++) S.push({ t: 'fix', i, msg: '' });
  }

  if (kind === 'quick') {
    const qs = (lo, hi) => {
      if (lo > hi) return;
      if (lo === hi) {
        S.push({ t: 'range', lo, hi, msg: '' });
        S.push({ t: 'fix', i: lo, msg: `✅ <span class="g"><b>${vv(lo)}</b>${jo(vv(lo), '은')} 혼자 남은 구간. 자동 확정!</span>` });
        return;
      }
      S.push({ t: 'range', lo, hi, msg: `${lo + 1}~${hi + 1}번 구간 차례. 피벗은 맨 뒤 <span class="v"><b>${vv(hi)}</b></span> 📍` });
      S.push({ t: 'mark', i: hi, ch: '📍', msg: '' });
      let i = lo;
      for (let j = lo; j < hi; j++) {
        const small = vv(j) < vv(hi);
        S.push({ t: 'compare', i: j, j: hi,
          msg: `<b>${vv(j)}</b> vs 피벗 <span class="v"><b>${vv(hi)}</b></span>. ` + (small
            ? `<span class="y">작다! 왼쪽 팀으로</span>` : `크다. 오른쪽 팀 대기`) });
        if (small) {
          if (i !== j) {
            S.push({ t: 'swap', i, j, msg: `<b>${vv(j)}</b>${jo(vv(j), '을')} 왼쪽 팀 자리(${i + 1}번)로` });
            [a[i], a[j]] = [a[j], a[i]];
          }
          i++;
        }
      }
      if (i !== hi) {
        S.push({ t: 'swap', i, j: hi, msg: `📍 피벗 <span class="v"><b>${vv(hi)}</b></span>${jo(vv(hi), '이')} 두 팀 사이 자기 자리로 착석!` });
        [a[i], a[hi]] = [a[hi], a[i]];
      }
      S.push({ t: 'markclear', msg: '' });
      S.push({ t: 'fix', i, msg: `✅ <span class="g">피벗 <b>${vv(i)}</b> 자리 확정!</span> 이제 왼쪽 팀·오른쪽 팀을 각각 또 나눈다 (분할 정복)` });
      qs(lo, i - 1); qs(i + 1, hi);
    };
    qs(0, N - 1);
    S.push({ t: 'range', lo: 0, hi: N - 1, msg: '' });
  }

  if (kind === 'merge') {
    // 하향식(top-down) 재귀 합병 정렬. 분할(split) → 양쪽 재귀 → 합병(mstart·compare·mmove·mback)
    const rl = (lo, hi) => lo === hi ? `${lo + 1}번` : `${lo + 1}~${hi + 1}번`;
    const tmp = new Array(N);
    const ms = (lo, hi) => {
      if (lo >= hi) return;
      const mid = (lo + hi) >> 1;
      S.push({ t: 'split', lo, mid, hi, msg: `${rl(lo, hi)}을 반으로: ${rl(lo, mid)} | ${rl(mid + 1, hi)}` });
      ms(lo, mid); ms(mid + 1, hi);
      const final = lo === 0 && hi === N - 1;
      S.push({ t: 'mstart', lo, mid, hi,
        msg: `왼쪽 무더기 ${rl(lo, mid)}과 오른쪽 무더기 ${rl(mid + 1, hi)}을 합칩니다. 두 무더기의 <b>맨 앞 카드끼리만</b> 비교해요.` });
      let i = lo, j = mid + 1, k = lo;
      while (i <= mid && j <= hi) {
        const L = a[i].v, R = a[j].v, takeLeft = L <= R;      // 같으면 왼쪽 먼저(안정 정렬)
        S.push({ t: 'compare', i, j,
          msg: `맨 앞끼리 비교: <b>${L}</b>${jo(L, '와')} <b>${R}</b>. ` + (L === R
            ? `<span class="y">같으면 왼쪽 무더기 것을 먼저 옮깁니다(안정 정렬).</span>`
            : takeLeft ? `<span class="y">왼쪽의 ${L}${jo(L, '이')} 더 작아요.</span>`
                       : `<span class="y">오른쪽의 ${R}${jo(R, '이')} 더 작아요.</span>`) });
        const v = takeLeft ? L : R;
        S.push({ t: 'mmove', from: takeLeft ? i : j, to: k, msg: `<b>${v}</b>${jo(v, '을')} 임시 줄 ${k + 1}번 칸으로` });
        tmp[k++] = takeLeft ? a[i++] : a[j++];
      }
      while (i <= mid) {
        S.push({ t: 'mmove', from: i, to: k, msg: `오른쪽 무더기가 바닥났어요. 남은 <b>${a[i].v}</b>${jo(a[i].v, '을')} 차례로 임시 줄 ${k + 1}번 칸으로` });
        tmp[k++] = a[i++];
      }
      while (j <= hi) {
        S.push({ t: 'mmove', from: j, to: k, msg: `왼쪽 무더기가 바닥났어요. 남은 <b>${a[j].v}</b>${jo(a[j].v, '을')} 차례로 임시 줄 ${k + 1}번 칸으로` });
        tmp[k++] = a[j++];
      }
      for (let x = lo; x <= hi; x++) a[x] = tmp[x];
      S.push({ t: 'mback', lo, hi, final,
        msg: final ? `합친 결과를 제자리에. 전체가 하나의 무더기로 정리됐어요!`
                   : `합친 결과를 제자리에. <span class="m">${rl(lo, hi)}이 정리된 무더기</span>가 됐어요.` });
    };
    ms(0, N - 1);
    S.push({ t: 'range', lo: 0, hi: N - 1, msg: '' });
  }

  if (kind === 'seq') {
    let found = false;
    for (let i = 0; i < N; i++) {
      const hit = vv(i) === target;
      if (hit) found = true;
      S.push({ t: 'scheck', i, hit,
        msg: hit
          ? `${i + 1}번 칸. <span class="g"><b>${vv(i)}</b>! 찾았다 (${i + 1}번 만에)</span>`
          : `${i + 1}번 칸 열기. <b>${vv(i)}</b>… 아니네, 다음 칸!` });
      if (hit) break;
    }
    S.push({ t: 'sdone', found, msg: '' });
  }

  if (kind === 'bin') {
    let lo = 0, hi = N - 1, found = false;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (vv(mid) === target) {
        S.push({ t: 'scheck', i: mid, hit: true, msg: `가운데 ${mid + 1}번 확인. <span class="g"><b>${vv(mid)}</b>! 찾았다!</span>` });
        found = true;
        break;
      } else if (vv(mid) < target) {
        S.push({ t: 'scheck', i: mid, hit: false, msg: `가운데 ${mid + 1}번은 <b>${vv(mid)}</b>. 목표 <b>${target}</b>${jo(target, '이')} 더 크다 → <span class="y">왼쪽 절반은 볼 필요도 없다!</span>` });
        S.push({ t: 'sdim', lo, hi: mid, msg: `${lo + 1}~${mid + 1}번 칸 통째로 배제!` });
        lo = mid + 1;
      } else {
        S.push({ t: 'scheck', i: mid, hit: false, msg: `가운데 ${mid + 1}번은 <b>${vv(mid)}</b>. 목표 <b>${target}</b>${jo(target, '이')} 더 작다 → <span class="y">오른쪽 절반은 볼 필요도 없다!</span>` });
        S.push({ t: 'sdim', lo: mid, hi, msg: `${mid + 1}~${hi + 1}번 칸 통째로 배제!` });
        hi = mid - 1;
      }
    }
    S.push({ t: 'sdone', found, msg: '' });
  }

  if (SORT_ALGOS.includes(kind)) S.push({ t: 'done', msg: '' });
  return S;
}

/* ================================================================
   무대 렌더링 · 단계 적용
================================================================ */
const stage = document.getElementById('stage');
let cmpCount = 0, swpCount = 0, heldCard = null;

/* 반응형 배치: 슬롯 폭 = 컨테이너 폭 / 카드 수. 간격·카드 폭·글자 크기(CSS calc)가 여기서 따라 정해진다 */
const LAYOUT = { sw: 0, gap: 0, cw: 0 };
function layout() {
  const sw = stage.clientWidth / N;
  const gap = Math.max(4, Math.min(16, sw * 0.14));
  LAYOUT.sw = sw; LAYOUT.gap = gap; LAYOUT.cw = sw - gap;
  stage.style.setProperty('--sw', sw + 'px');
  stage.style.setProperty('--cw', LAYOUT.cw + 'px');
  stage.classList.toggle('tight', LAYOUT.cw < 60);   // 좁은 카드: 코너 숫자 숨김·라벨 축소
}
function slotLeft(slot) { return slot * LAYOUT.sw + LAYOUT.gap / 2; }

/* 카드 위치: slot = 칸 번호, row 0 = 원래 줄 / 1 = 합병 임시 줄 */
function posCard(c) {
  if (c.slot >= 0) c.el.style.left = slotLeft(c.slot) + 'px';
  c.el.classList.toggle('intemp', c.row === 1);
}
/* 보조 표시(합병 정렬): 세로 구분선 위치·임시 줄 활성 구간. 단계 되돌리기를 위해 상태로 보관 */
let ui = { div: -1, tlo: -1, thi: -1 };
function renderAux() {
  const dv = stage.querySelector('.divider');
  dv.classList.toggle('show', ui.div >= 0);
  dv.style.left = ui.div >= 0 ? (ui.div * LAYOUT.sw) + 'px' : '';
  stage.querySelectorAll('.tslot').forEach((t, i) => {
    t.style.left = slotLeft(i) + 'px';
    t.classList.toggle('on', i >= ui.tlo && i <= ui.thi);
  });
}

function buildStage() {
  stage.querySelectorAll('.ncard, .slot-label, .tslot, .tcap, .divider').forEach(e => e.remove());
  stage.classList.toggle('merge', algo === 'merge');
  layout();
  ui = { div: -1, tlo: -1, thi: -1 };
  if (algo === 'merge') {                             // 임시 줄은 합병 정렬 탭에서만
    for (let i = 0; i < N; i++) {
      const t = document.createElement('div'); t.className = 'tslot'; stage.appendChild(t);
    }
    const cap = document.createElement('div'); cap.className = 'tcap';
    cap.textContent = '임시 줄: 두 무더기를 합칠 때 잠깐 쓰는 자리'; stage.appendChild(cap);
  }
  cards = stageValues.map((v, i) => {
    const el = document.createElement('div');
    el.className = 'ncard';
    el.dataset.v = v;                                 // 코너 숫자(CSS content) + 프로브 textContent 오염 방지
    el.style.left = slotLeft(i) + 'px';
    el.innerHTML = '<span class="crown">👑</span><span class="chk"></span>' + v;
    stage.appendChild(el);
    return { id: i, v, el, slot: i, row: 0 };
  });
  for (let i = 0; i < N; i++) {
    const lb = document.createElement('div');
    lb.className = 'slot-label';
    lb.style.left = (i * LAYOUT.sw) + 'px';
    lb.textContent = (i + 1) + '번';
    stage.appendChild(lb);
  }
  const dv = document.createElement('div'); dv.className = 'divider'; stage.appendChild(dv);
  renderAux();
}
const bySlot = slot => cards.find(c => c.slot === slot && c.row === 0);
const byTemp = slot => cards.find(c => c.slot === slot && c.row === 1);
function dimOutside(lo, hi) {
  cards.forEach(c => {
    if (c.row === 1 || (c.slot >= lo && c.slot <= hi)) c.el.classList.remove('dim');
    else if (!c.el.classList.contains('done')) c.el.classList.add('dim');
    else c.el.classList.remove('dim');
  });
}

function clearMarks(keepDone = true) {
  cards.forEach(c => {
    c.el.classList.remove('cmp');
    if (!keepDone) c.el.classList.remove('done', 'key', 'held');
  });
}

function applyStep(s) {
  clearMarks();
  if (algo === 'merge') ui.div = -1;                   // 구분선은 나누는 순간에만 잠깐
  if (s.t === 'split' || s.t === 'mstart') {
    dimOutside(s.lo, s.hi);
    ui.div = s.mid + 1;
    if (s.t === 'mstart') { ui.tlo = s.lo; ui.thi = s.hi; }
  }
  if (s.t === 'mmove') {
    const A = bySlot(s.from);
    A.row = 1; A.slot = s.to;
    A.el.classList.remove('merged');
    posCard(A);
    swpCount++;
  }
  if (s.t === 'mback') {                               // 되돌림은 이동 횟수에 넣지 않는다
    for (let x = s.lo; x <= s.hi; x++) {
      const T = byTemp(x);
      T.row = 0; posCard(T);
      if (!s.final) T.el.classList.add('merged');
    }
    ui.tlo = -1; ui.thi = -1;
  }
  if (s.t === 'compare') {
    const A = bySlot(s.i); if (A) A.el.classList.add('cmp');
    if (s.j !== null && s.j !== undefined) { const B = bySlot(s.j); if (B) B.el.classList.add('cmp'); }
    if (s.heldCmp && heldCard) heldCard.el.classList.add('held'); // 유지
    cmpCount++;
  }
  if (s.t === 'swap') {
    const A = bySlot(s.i), B = bySlot(s.j);
    [A.slot, B.slot] = [B.slot, A.slot];
    A.el.style.left = slotLeft(A.slot) + 'px';
    B.el.style.left = slotLeft(B.slot) + 'px';
    A.el.classList.add('hop'); B.el.classList.add('hop2');   // 스쳐 지나가는 호핑 연출
    setTimeout(() => { A.el.classList.remove('hop'); B.el.classList.remove('hop2'); }, 340);
    swpCount++;
  }
  if (s.t === 'key' || s.t === 'mark') {
    cards.forEach(c => c.el.classList.remove('key'));
    const A = bySlot(s.i);
    A.el.classList.add('key');
    A.el.querySelector('.crown').textContent = s.t === 'key' ? '👑' : (s.ch || '📍');
    if (algo === 'select' && s.t === 'key') document.getElementById('minVar').innerHTML =
      `👑 최소 후보 <b>min = ${s.v}</b> <span class="slotn">${s.i + 1}번 카드</span>`;
  }
  if (s.t === 'markclear') cards.forEach(c => c.el.classList.remove('key'));
  if (s.t === 'range') dimOutside(s.lo, s.hi);
  if (s.t === 'scheck') {
    const A = bySlot(s.i);
    A.el.classList.add('cmp');
    cmpCount++;
    if (s.hit) { A.el.classList.remove('cmp'); A.el.classList.add('done'); }
    else if (algo === 'seq') A.el.classList.add('dim');
  }
  if (s.t === 'sdim') {
    for (let k = s.lo; k <= s.hi; k++) { const C = bySlot(k); if (C && !C.el.classList.contains('done')) C.el.classList.add('dim'); }
  }
  if (s.t === 'sdone') {
    if (s.found) setNarr(algo === 'seq'
      ? `<span class="g"><b>탐색 종료</b></span> · 비교 <b>${cmpCount}</b>회. 1,024장이면 순차 탐색은 최악 <b>1,024번!</b>`
      : `<span class="g"><b>탐색 종료</b></span> · 비교 <b>${cmpCount}</b>회. 범위 크기 1,024를 절반씩 줄여 1로 만드는 횟수는 <b>10회</b>입니다. 마지막 값 확인은 이 축소 횟수에 포함하지 않습니다.`);
    else setNarr(algo === 'seq'
      ? `<span class="y"><b>${target}</b>${jo(target, '은')} 없어요.</span> ${N}칸을 끝까지 다 열어 본 뒤에야 '없다'는 걸 알았어요 · 비교 <b>${cmpCount}</b>회. 1,024장이면 없다는 걸 확인하는 데만 <b>1,024번!</b>`
      : `<span class="y"><b>${target}</b>${jo(target, '은')} 없어요.</span> 남은 범위가 비었으니 탐색 끝 · 비교 <b>${cmpCount}</b>회. 정렬돼 있어서 모든 칸을 열지 않고도 '없다'고 확신할 수 있어요.`);
    recordResult();
    stopAuto();
    document.getElementById('btnNext').disabled = true;
  }
  if (s.t === 'fix') {
    if (s.keyclear) cards.forEach(c => c.el.classList.remove('key'));
    const A = bySlot(s.i); if (A) A.el.classList.add('done');
  }
  if (s.t === 'pick') {
    heldCard = bySlot(s.i);
    heldCard.slot = -1;                       // 손에 듦
    heldCard.el.classList.add('held');
  }
  if (s.t === 'shift') {
    const A = bySlot(s.from);
    A.slot = s.to;
    A.el.style.left = slotLeft(A.slot) + 'px';
    A.el.classList.add('hop2');
    setTimeout(() => A.el.classList.remove('hop2'), 340);
    swpCount++;
  }
  if (s.t === 'place') {
    heldCard.slot = s.i;
    heldCard.el.style.left = slotLeft(s.i) + 'px';
    heldCard.el.classList.remove('held');
    heldCard = null;
  }
  if (s.t === 'done') {
    cards.forEach(c => { c.el.classList.add('done'); c.el.classList.remove('merged', 'dim'); });
    setNarr(`<span class="g"><b>정렬 완료!</b></span> 비교 <b>${cmpCount}</b>회 · 이동 <b>${swpCount}</b>회. 다른 알고리즘과 같은 숫자로 비교해 보자!`);
    recordResult();
    stopAuto();
    document.getElementById('btnNext').disabled = true;
  }
  if (s.msg) setNarr(s.msg);
  if (algo === 'merge') renderAux();
  document.getElementById('cntCmp').textContent = cmpCount;
  document.getElementById('cntSwp').textContent = swpCount;
}

function setNarr(html) { document.getElementById('narr').innerHTML = '<span class="narr-line">' + html + '</span>'; }

/* ================================================================
   흐름 제어
================================================================ */
let stageValues = [], target = null, chosenTarget = null;   // chosenTarget = 사용자가 고른 찾을 번호
let stepHistory = [];                                            // 단계별 화면 기록(이전 단계용)
function resetRun() {
  stopAuto();
  stepHistory = [];
  clearInputError();
  const isSearch = algo === 'seq' || algo === 'bin';
  document.body.classList.toggle('search', isSearch);
  document.body.classList.toggle('select', algo === 'select');
  if (algo === 'select') document.getElementById('minVar').innerHTML =
    `👑 최소 후보 <b>min = ?</b> <span class="slotn">[다음 단계]로 찾기 시작</span>`;
  stageValues = algo === 'bin' ? [...values].sort((x, y) => x - y) : [...values];
  target = isSearch ? (chosenTarget ?? stageValues[Math.floor(Math.random() * N)]) : null;
  if (isSearch) document.getElementById('targetVal').textContent = target;
  steps = genSteps(stageValues, algo, target);
  ptr = 0; cmpCount = 0; swpCount = 0; heldCard = null;
  buildStage();
  if (isSearch) cards.forEach(c => {                  // 탐색: 카드를 누르면 그 숫자가 목표
    c.el.tabIndex = 0; c.el.setAttribute('role', 'button');
    c.el.setAttribute('aria-label', c.v + ' 찾기');
  });
  renderTop(); renderLegend(); renderResults();
  document.getElementById('cntCmp').textContent = 0;
  document.getElementById('cntSwp').textContent = 0;
  document.getElementById('btnNext').disabled = false;
  const first = { bubble: '이웃 둘씩 비교해서, 큰 수를 뒤로! [다음 단계]를 눌러 시작',
                  select: '👑 남은 카드 중 최솟값을 찾아 맨 앞으로! [다음 단계]를 눌러 시작',
                  insert: '카드를 뽑아 왼쪽 정리된 구간에 끼워 넣자! [다음 단계]를 눌러 시작',
                  quick: '피벗(📍)보다 작으면 왼쪽 팀! 나누고 또 나누자. [다음 단계]로 시작',
                  merge: '1장이 될 때까지 반으로 나눈 뒤, 맨 앞 카드끼리 비교하며 합치자! [다음 단계]로 시작',
                  seq: `택배함 ${N}칸. 목표 <b>${target}</b>${jo(target, '을')} 1번 칸부터 차례로! [다음 단계]로 시작 (카드를 누르면 찾을 번호가 바뀌어요)`,
                  bin: `카드는 정렬되어 있다(이진 탐색의 조건!). 목표 <b>${target}</b>, 가운데부터 공략! [다음 단계]로 시작 (카드를 누르면 찾을 번호가 바뀌어요)` };
  setNarr(first[algo]);
  updatePrev();
}
function advance() {
  const s = steps[ptr++];
  applyStep(s);
  if (s.msg === '' && ptr < steps.length) advance(); // 메시지 없는 정리 단계는 건너뛰듯 연달아
}
function next() {
  if (ptr >= steps.length) return;
  stepHistory.push(snapshot());                          // 이 단계 직전 화면을 기록
  advance();
  updatePrev();
}
/* 이전 단계: 기록해 둔 카드 배열·강조·횟수·설명을 그대로 되돌린다 (자동 재생 중이면 일시정지 후) */
function prev() {
  stopAuto();
  if (!stepHistory.length) return;
  restore(stepHistory.pop());
  updatePrev();
}
function updatePrev() { document.getElementById('btnPrev').disabled = stepHistory.length === 0; }
function snapshot() {
  return {
    ptr, cmpCount, swpCount, heldId: heldCard ? heldCard.id : null, ui: { ...ui },
    cards: cards.map(c => ({ slot: c.slot, row: c.row, left: c.el.style.left,
      cls: c.el.className.split(' ').filter(k => k !== 'hop' && k !== 'hop2').join(' '),
      crown: c.el.querySelector('.crown').textContent })),
    narr: document.getElementById('narr').innerHTML,
    minVar: document.getElementById('minVar').innerHTML,
    nextDisabled: document.getElementById('btnNext').disabled,
  };
}
function restore(S) {
  ptr = S.ptr; cmpCount = S.cmpCount; swpCount = S.swpCount;
  heldCard = S.heldId === null ? null : cards.find(c => c.id === S.heldId);
  cards.forEach((c, i) => {
    const o = S.cards[i];
    c.slot = o.slot; c.row = o.row;
    c.el.className = o.cls;
    c.el.style.left = o.left;
    c.el.querySelector('.crown').textContent = o.crown;
    if (c.slot >= 0) posCard(c);
  });
  ui = { ...S.ui };
  if (algo === 'merge') renderAux();
  document.getElementById('narr').innerHTML = S.narr;
  document.getElementById('minVar').innerHTML = S.minVar;
  document.getElementById('btnNext').disabled = S.nextDisabled;
  document.getElementById('cntCmp').textContent = cmpCount;
  document.getElementById('cntSwp').textContent = swpCount;
}
function stopAuto() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  document.getElementById('btnAuto').classList.remove('on');
  document.getElementById('btnAuto').textContent = '자동 재생';
}
function toggleAuto() {
  if (autoTimer) { stopAuto(); return; }
  document.getElementById('btnAuto').classList.add('on');
  document.getElementById('btnAuto').textContent = '일시정지';
  autoTimer = setInterval(() => {
    if (ptr >= steps.length) { stopAuto(); return; }
    next();
  }, 1000 / speed);
}

/* ================================================================
   조작부 배선
================================================================ */
document.getElementById('btnNext').addEventListener('click', next);
document.getElementById('btnPrev').addEventListener('click', prev);
document.getElementById('btnReset').addEventListener('click', () => resetRun());
document.getElementById('btnAuto').addEventListener('click', toggleAuto);
/* 배속: 누를 때마다 ×1 → ×2 → ×4, 버튼에 현재 배속 표시 */
document.getElementById('btnFast').addEventListener('click', function () {
  speed = speed === 1 ? 2 : speed === 2 ? 4 : 1;
  this.textContent = '×' + speed;
  this.setAttribute('aria-label', '재생 속도 ×' + speed);
  this.classList.toggle('on', speed > 1);
  if (autoTimer) { stopAuto(); toggleAuto(); }
});

/* ---- 탭 제목 · 범례 · 결과표 ---- */
const ALGO_NAME = { bubble: '버블 정렬', select: '선택 정렬', insert: '삽입 정렬', quick: '퀵 정렬',
                    merge: '합병 정렬', seq: '순차 탐색', bin: '이진 탐색' };
function renderTop() {
  document.getElementById('tabTitle').innerHTML = `${ALGO_NAME[algo]} <span>${EXPLAIN[algo].h}</span>`;
  if (target !== null) document.getElementById('targetVal').textContent = target;
}
const LEG_ITEM = {
  cmp: '<i class="cmp"></i>비교 중', done: '<i class="done">✓</i>확정', found: '<i class="done">✓</i>찾았다',
  dim: '<i class="dim"></i>흐림 = 지금 범위 밖', pivot: '<i class="emo">📍</i>피벗', crown: '<i class="emo">👑</i>최소 후보',
  held: '<i class="hero"></i>뽑아 든 카드', merged: '<i class="merged"></i>정리된 무더기',
};
const LEGEND = { bubble: ['cmp', 'done'], select: ['cmp', 'crown', 'done'], insert: ['cmp', 'held', 'done'],
                 quick: ['cmp', 'pivot', 'dim', 'done'], merge: ['cmp', 'dim', 'merged', 'done'],
                 seq: ['cmp', 'dim', 'found'], bin: ['cmp', 'dim', 'found'] };
function renderLegend() {
  document.getElementById('legend').innerHTML = LEGEND[algo].map(k => `<span data-k="${k}">${LEG_ITEM[k]}</span>`).join('');
}
/* 결과는 메모리에만. 숫자 세트가 바뀌면 비운다 (localStorage 안 씀) */
let results = {};
function recordResult() {
  results[algo] = { cmp: cmpCount, swp: swpCount, target, found: !!cards.find(c => c.v === target) };
  renderResults();
}
function renderResults() {
  const row = (k, cells) => `<tr data-algo="${k}"${k === algo ? ' class="cur"' : ''}><td>${ALGO_NAME[k]}</td>${cells}</tr>`;
  document.querySelector('#resSort tbody').innerHTML = SORT_ALGOS.map(k => {
    const r = results[k];
    return row(k, r ? `<td>${r.cmp}</td><td>${r.swp}</td>` : '<td class="none">-</td><td class="none">-</td>');
  }).join('');
  document.querySelector('#resSearch tbody').innerHTML = ['seq', 'bin'].map(k => {
    const r = results[k];
    return row(k, r ? `<td>${r.target}${r.found ? '' : ' (없음)'}</td><td>${r.cmp}</td>` : '<td class="none">-</td><td class="none">-</td>');
  }).join('');
}
function setValues(v) {           // 숫자 세트 교체 = 결과표 비우기 + 고른 목표 해제
  values = v; results = {}; chosenTarget = null;
}

/* ---- [C7] 탐색 목표 고르기 ---- */
function chooseTarget(v) {
  chosenTarget = v;
  resetRun();
}
stage.addEventListener('click', e => {
  if (algo !== 'seq' && algo !== 'bin') return;
  const el = e.target.closest('.ncard'); if (!el) return;
  chooseTarget(+el.dataset.v);
});
stage.addEventListener('keydown', e => {
  if ((algo !== 'seq' && algo !== 'bin') || e.key !== 'Enter') return;
  const el = e.target.closest('.ncard'); if (!el) return;
  e.preventDefault(); chooseTarget(+el.dataset.v);
  const again = cards.find(c => c.v === +el.dataset.v); if (again) again.el.focus();
});
document.getElementById('btnMissing').addEventListener('click', () => {
  let v;
  do { v = 1 + Math.floor(Math.random() * 99); } while (values.includes(v));
  chooseTarget(v);
});
/* 서로 다른 무작위 숫자 n개 */
function randomSet(n) {
  const pool = [];
  while (pool.length < n) {
    const v = 5 + Math.floor(Math.random() * 94);
    if (!pool.includes(v)) pool.push(v);
  }
  return pool;
}
document.getElementById('btnShuffle').addEventListener('click', () => {
  setValues(randomSet(N));
  resetRun();
});
/* 슬라이더·입력 UI와 N 동기화 */
const EXAMPLE = [34, 7, 88, 21, 55, 72, 44, 13, 90, 26];
function syncCountUI() {
  document.getElementById('cardCount').value = N;
  document.getElementById('cardCountLbl').textContent = N;
  const inp = document.getElementById('numInput');
  inp.placeholder = '직접 입력: ' + EXAMPLE.slice(0, N).join(',');
  inp.setAttribute('aria-label', '숫자 ' + N + '개 직접 입력');
}
/* 카드 개수 변경 = 새 무작위 세트 + 안내 한 줄 + 직접 입력 칸 비우기 */
function applyCount(newN) {
  N = Math.max(N_MIN, Math.min(N_MAX, newN | 0));
  setValues(randomSet(N));
  document.getElementById('numInput').value = '';
  syncCountUI();
  renderExplain();   // 순차탐색 '칸이 N개' 등 동적 문구 갱신
  resetRun();
  setNarr('<span class="narr-note">카드 수가 바뀌어 새 숫자를 만들었어요.</span>' + document.querySelector('#narr .narr-line').innerHTML);
}
/* 쉼표·전각 쉼표·공백 모두 구분자. 오류는 원인별로 하나씩 알려 준다 */
const TIMES = { 2: '두 번', 3: '세 번', 4: '네 번', 5: '다섯 번' };
function parseNumbers(raw) {
  const toks = raw.split(/[,\uFF0C\s]+/).filter(Boolean);
  if (!toks.length) return { err: `숫자를 넣어 주세요. 예: ${EXAMPLE.slice(0, N).join(',')}` };
  const bad = toks.find(t => !/^-?\d+$/.test(t));
  if (bad !== undefined) return { err: `"${bad}"는 숫자가 아니에요. 1~99 사이 정수를 쉼표나 띄어쓰기로 나눠 넣어 주세요` };
  const nums = toks.map(Number);
  const out = nums.find(n => n < 1 || n > 99);
  if (out !== undefined) return { err: out > 99 ? `${out}${jo(out, '은')} 1~99 범위를 넘어요` : `${out}${jo(out, '은')} 1~99 범위보다 작아요` };
  const cnt = {}; nums.forEach(n => { cnt[n] = (cnt[n] || 0) + 1; });
  const dup = nums.find(n => cnt[n] > 1);
  if (dup !== undefined) return { err: `${dup}${jo(dup, '가')} ${TIMES[cnt[dup]] || cnt[dup] + '번'} 들어갔어요. 서로 다른 숫자만 넣어 주세요` };
  if (nums.length < N_MIN || nums.length > N_MAX) return { err: `숫자가 ${nums.length}개예요. ${N_MIN}~${N_MAX}개를 넣어 주세요` };
  return { nums };
}
function showInputError(msg) {
  const inp = document.getElementById('numInput');
  inp.classList.add('bad'); inp.setAttribute('aria-invalid', 'true');
  document.getElementById('inputErr').textContent = '⚠️ ' + msg;
}
function clearInputError() {
  const inp = document.getElementById('numInput');
  inp.classList.remove('bad'); inp.removeAttribute('aria-invalid');
  document.getElementById('inputErr').textContent = '';
}
document.getElementById('numInput').addEventListener('input', clearInputError);
document.getElementById('numInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btnApply').click();
});
document.getElementById('btnApply').addEventListener('click', () => {
  const r = parseNumbers(document.getElementById('numInput').value.trim());
  if (r.err) { showInputError(r.err); return; }
  const nums = r.nums;
  setValues(nums);
  N = nums.length;      // 입력 개수에 맞춰 카드 수 자동 동기화
  syncCountUI();
  renderExplain();
  resetRun();
});
{
  const slider = document.getElementById('cardCount');
  slider.addEventListener('input', () => {
    document.getElementById('cardCountLbl').textContent = slider.value;
  });
  slider.addEventListener('change', () => applyCount(+slider.value));
}
function renderExplain() {
  const e = EXPLAIN[algo];
  document.getElementById('explainBox').innerHTML =
    `<h2>${e.h}</h2>${e.a ? `<p class="aka">${e.a}</p>` : ''}<p>${e.p}</p><div class="think">${e.t}</div>`.replaceAll('{N}', N);
}
document.querySelectorAll('.algo-tab').forEach(b =>
  b.addEventListener('click', () => {
    algo = b.dataset.algo;
    chosenTarget = null;
    document.querySelectorAll('.algo-tab').forEach(x => x.classList.toggle('on', x === b));
    renderExplain();
    resetRun();
  }));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
});
window.addEventListener('resize', () => {
  // 카드 폭·위치 재계산 (진행 상태 유지한 채 재배치)
  layout();
  cards.forEach(c => { if (c.slot >= 0) c.el.style.left = slotLeft(c.slot) + 'px'; });
  stage.querySelectorAll('.slot-label').forEach((lb, i) => { lb.style.left = (i * LAYOUT.sw) + 'px'; });
  renderAux();
});

/* ── 초기화 ── */
syncCountUI();
document.querySelector('.algo-tab.on').click();
</script>
